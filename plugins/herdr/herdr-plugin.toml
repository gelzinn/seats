id = "seats.resume"
name = "Seats"
version = "0.1.0"
# Resume commands reported by a plugin need herdr 0.9.2.
min_herdr_version = "0.9.2"
description = "Resume Claude Code panes on the seat each conversation ran on"
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_detected"
command = ["seats", "hook", "herdr"]

[[events]]
on = "pane.agent_status_changed"
command = ["seats", "hook", "herdr"]
